apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing (the APK published as the beta). The key and its passwords live outside the
// repo, in ~/.frimee/keystore.properties:
//   storeFile=C:/Users/<you>/.frimee/frimee-release.jks
//   storePassword=…
//   keyAlias=frimee
//   keyPassword=…
// Every release must be signed with the same key, or Android will not install it as an update.
def releaseKeystoreProps = new Properties()
def releaseKeystoreFile = new File(System.getProperty("user.home"), ".frimee/keystore.properties")
if (releaseKeystoreFile.exists()) {
    releaseKeystoreFile.withInputStream { releaseKeystoreProps.load(it) }
}

android {
    buildFeatures {
        viewBinding true
    }
    namespace = "com.frimee.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.frimee.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump versionCode on every published build; phones only update to a higher number.
        versionCode 1
        versionName "0.1.0-beta"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystoreProps["storeFile"]) {
            release {
                storeFile file(releaseKeystoreProps["storeFile"])
                storePassword releaseKeystoreProps["storePassword"]
                keyAlias releaseKeystoreProps["keyAlias"]
                keyPassword releaseKeystoreProps["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystoreProps["storeFile"]) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // Calls: CallStyle notifications and the push service that extends the plugin's.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
